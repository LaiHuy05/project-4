name: PHP syntax and security smoke
on:
  push:
    paths:
      - 'mvc/**'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'mvc/**'
      - '.github/workflows/php-lint.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint
        run: find mvc -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Security smoke test
        run: php mvc/tests/security_smoke.php
